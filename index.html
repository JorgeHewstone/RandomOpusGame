<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomba Opus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [dropTimeStr, setDropTimeStr] = useState("03:35");
            const [minTime, setMinTime] = useState(30);
            const [maxTime, setMaxTime] = useState(120);
            const [gameState, setGameState] = useState("idle");
            const [errorMsg, setErrorMsg] = useState("");

            // Reproductores de audio HTML5 nativos (A prueba de fallos en iOS)
            const audio1Ref = useRef(null);
            const audio2Ref = useRef(null);
            const gameTimerRef = useRef(null);
            const fadeTimerRef = useRef(null);

            useEffect(() => {
                // Pre-cargamos los reproductores al abrir la web
                audio1Ref.current = new Audio('./Opus.mp3');
                audio2Ref.current = new Audio('./Opus.mp3');
                audio1Ref.current.preload = "auto";
                audio2Ref.current.preload = "auto";
            }, []);

            const parseTime = (timeStr) => {
                const parts = timeStr.split(':');
                if (parts.length === 2) return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                return parseInt(timeStr, 10) || 0;
            };

            const stopJuego = () => {
                if (audio1Ref.current) {
                    audio1Ref.current.pause();
                    audio1Ref.current.currentTime = 0;
                }
                if (audio2Ref.current) {
                    audio2Ref.current.pause();
                    audio2Ref.current.currentTime = 0;
                }
                clearInterval(gameTimerRef.current);
                clearInterval(fadeTimerRef.current);
                setGameState("idle");
            };

            const iniciarJuego = () => {
                const dropSeconds = parseTime(dropTimeStr);
                let minSeconds = parseInt(minTime, 10);
                let maxSeconds = parseInt(maxTime, 10);

                if (dropSeconds <= 0) return setErrorMsg("El drop debe ser mayor a 0.");
                if (minSeconds >= maxSeconds) maxSeconds = minSeconds + 10;
                if (maxSeconds > dropSeconds) maxSeconds = dropSeconds;

                setErrorMsg("");
                stopJuego(); 

                const targetDuration = Math.floor(Math.random() * (maxSeconds - minSeconds + 1)) + minSeconds;
                const skipAmount = dropSeconds - targetDuration;

                // 🟢 DESBLOQUEO IOS: Iniciamos ambos reproductores en silencio con el clic
                try {
                    audio1Ref.current.volume = 1;
                    audio1Ref.current.currentTime = 0;
                    audio1Ref.current.play().catch(e => console.warn("A1:", e));

                    audio2Ref.current.volume = 0;
                    audio2Ref.current.currentTime = 0;
                    // Lo reproducimos e inmediatamente pausamos para dejarlo listo
                    audio2Ref.current.play().then(() => {
                        audio2Ref.current.pause(); 
                    }).catch(e => console.warn("A2:", e));
                } catch (err) {
                    return setErrorMsg("Error iniciando el audio. Asegúrate de tocar la pantalla.");
                }

                setGameState("playing");

                // Sistema de tiempo
                let gameTimeMs = 0;
                const tickMs = 100;
                const introDuration = Math.min(15, targetDuration * 0.4);
                const crossfadeDuration = Math.min(4, introDuration * 0.8);
                const crossfadeStartTime = introDuration - crossfadeDuration;
                let fadeStarted = false;

                // Bucle principal del juego
                gameTimerRef.current = setInterval(() => {
                    gameTimeMs += tickMs;
                    const gameTimeSec = gameTimeMs / 1000;

                    // 1. Momento de la explosión
                    if (gameTimeSec >= targetDuration) {
                        clearInterval(gameTimerRef.current);
                        clearInterval(fadeTimerRef.current);
                        audio1Ref.current.pause();
                        audio2Ref.current.pause();
                        setGameState("exploded");
                        return;
                    }

                    // 2. Momento del "Salto difuminado" (Crossfade)
                    if (skipAmount > 0 && gameTimeSec >= crossfadeStartTime && !fadeStarted) {
                        fadeStarted = true;

                        // Preparamos la segunda pista en el momento del clímax
                        const s2Offset = crossfadeStartTime + skipAmount;
                        audio2Ref.current.currentTime = s2Offset;
                        audio2Ref.current.play().catch(e => console.error(e));

                        // Hacemos el cruce de volumen suavemente
                        let fadeTimeMs = 0;
                        const fadeTickMs = 50;
                        fadeTimerRef.current = setInterval(() => {
                            fadeTimeMs += fadeTickMs;
                            let progress = fadeTimeMs / (crossfadeDuration * 1000);
                            if (progress >= 1) progress = 1;

                            // Bajamos pista 1, subimos pista 2
                            if (audio1Ref.current) audio1Ref.current.volume = 1 - progress;
                            if (audio2Ref.current) audio2Ref.current.volume = progress;

                            // Apagamos pista 1 al terminar el cruce
                            if (progress === 1) {
                                clearInterval(fadeTimerRef.current);
                                if (audio1Ref.current) audio1Ref.current.pause();
                            }
                        }, fadeTickMs);
                    }
                }, tickMs);
            };

            return (
                <div className="flex flex-col items-center py-6 px-4">
                    <div className="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700 pb-6">
                        
                        <div className="bg-slate-950 p-6 text-center border-b border-slate-700">
                            <div className="text-5xl mb-2">
                                {gameState === 'exploded' ? '💥' : gameState === 'playing' ? '🔥' : '💣'}
                            </div>
                            <h1 className="text-3xl font-bold text-orange-500 uppercase tracking-wider">Bomba Opus</h1>
                        </div>

                        <div className="p-6 space-y-6">
                            {errorMsg && <div className="bg-red-900 text-red-200 p-3 rounded-lg text-sm font-semibold break-words">⚠️ {errorMsg}</div>}

                            <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700 text-center">
                                <div className="text-green-400 font-semibold">✅ Sistema listo y optimizado</div>
                                <div className="text-xs text-slate-400 mt-1">Soporte nativo para iOS activo</div>
                            </div>

                            <div className="bg-slate-900 p-4 rounded-xl space-y-4">
                                <div className="text-sm font-semibold text-slate-300">⚙️ Configuración</div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Momento del Drop (mm:ss)</label>
                                    <input type="text" value={dropTimeStr} onChange={(e) => setDropTimeStr(e.target.value)} disabled={gameState !== 'idle'} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-center font-mono text-lg" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Mínimo (seg)</label>
                                        <input type="number" value={minTime} onChange={(e) => setMinTime(e.target.value)} disabled={gameState !== 'idle'} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-center font-mono text-lg" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Máximo (seg)</label>
                                        <input type="number" value={maxTime} onChange={(e) => setMaxTime(e.target.value)} disabled={gameState !== 'idle'} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-center font-mono text-lg" />
                                    </div>
                                </div>
                            </div>

                            {gameState === 'idle' ? (
                                <button onClick={iniciarJuego} className="w-full py-4 rounded-xl font-bold text-lg bg-orange-600 hover:bg-orange-500 text-white transition-all shadow-[0_0_15px_rgba(234,88,12,0.4)]">
                                    ▶️ INICIAR JUEGO
                                </button>
                            ) : (
                                <button onClick={stopJuego} className="w-full py-4 rounded-xl font-bold text-lg bg-slate-700 text-white">
                                    ⏹️ CANCELAR JUEGO
                                </button>
                            )}
                        </div>
                    </div>

                    {gameState === 'exploded' && (
                        <div className="fixed inset-0 bg-red-950/95 z-50 flex flex-col items-center justify-center p-4">
                            <div className="text-8xl animate-bounce mb-4">💥</div>
                            <h2 className="text-5xl font-black text-white tracking-widest uppercase text-shadow-xl text-center">¡BOMBA!</h2>
                            <button onClick={stopJuego} className="mt-10 px-8 py-4 bg-white text-red-900 font-bold rounded-full text-xl">Jugar de nuevo</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
