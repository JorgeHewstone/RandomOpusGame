<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomba Opus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [rawAudioData, setRawAudioData] = useState(null);
            const [audioBuffer, setAudioBuffer] = useState(null);
            
            const [isLoading, setIsLoading] = useState(true);
            const [isDecoding, setIsDecoding] = useState(false);
            
            const [dropTimeStr, setDropTimeStr] = useState("03:42");
            const [minTime, setMinTime] = useState(30);
            const [maxTime, setMaxTime] = useState(120);

            const [gameState, setGameState] = useState("idle");
            const [errorMsg, setErrorMsg] = useState("");

            const audioCtxRef = useRef(null);
            const source1Ref = useRef(null);
            const source2Ref = useRef(null);
            const timeoutRef = useRef(null);

            // 1. SOLO DESCARGAMOS EL ARCHIVO (No iniciamos el audio aún para no enojar al iPhone)
            useEffect(() => {
                const descargarAudio = async () => {
                    try {
                        const response = await fetch('./Opus.mp3');
                        if (!response.ok) throw new Error("No se encontró opus.mp3 en el servidor");
                        
                        const arrayBuffer = await response.arrayBuffer();
                        setRawAudioData(arrayBuffer);
                        setIsLoading(false);
                    } catch (error) {
                        console.error(error);
                        setErrorMsg("Error: Asegúrate de haber subido 'opus.mp3' a GitHub exactamente con ese nombre.");
                        setIsLoading(false);
                    }
                };

                descargarAudio();
            }, []);

            const parseTime = (timeStr) => {
                const parts = timeStr.split(':');
                if (parts.length === 2) return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                return parseInt(timeStr, 10) || 0;
            };

            const stopJuego = () => {
                if (source1Ref.current) { try { source1Ref.current.stop(); } catch (e) {} }
                if (source2Ref.current) { try { source2Ref.current.stop(); } catch (e) {} }
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                setGameState("idle");
            };

            // 2. INICIAMOS EL AUDIO SOLO CUANDO EL USUARIO HACE CLIC EN EL BOTÓN
            const iniciarJuego = async () => {
                if (isLoading) return setErrorMsg("La canción aún se está descargando...");
                if (!rawAudioData && !audioBuffer) return setErrorMsg("Fallo al descargar los datos.");

                const dropSeconds = parseTime(dropTimeStr);
                let minSeconds = parseInt(minTime, 10);
                let maxSeconds = parseInt(maxTime, 10);

                if (dropSeconds <= 0) return setErrorMsg("El drop debe ser mayor a 0.");
                if (minSeconds >= maxSeconds) maxSeconds = minSeconds + 10;
                if (maxSeconds > dropSeconds) maxSeconds = dropSeconds;

                setErrorMsg("");
                stopJuego();

                // Aquí engañamos al iPhone: Se inicia al tocar el botón
                if (!audioCtxRef.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtxRef.current = new AudioContext();
                }
                const ctx = audioCtxRef.current;

                let currentBuffer = audioBuffer;

                // Si es la primera vez que se presiona Play, procesamos la canción
                if (!currentBuffer && rawAudioData) {
                    setIsDecoding(true);
                    try {
                        // Método a prueba de fallos para Safari
                        currentBuffer = await new Promise((resolve, reject) => {
                            ctx.decodeAudioData(
                                rawAudioData.slice(0), 
                                (decoded) => resolve(decoded),
                                (err) => reject(err)
                            );
                        });
                        setAudioBuffer(currentBuffer);
                        setIsDecoding(false);
                    } catch (err) {
                        setIsDecoding(false);
                        return setErrorMsg("Error procesando audio en iOS.");
                    }
                }

                if (ctx.state === 'suspended') await ctx.resume();

                // Cálculo matemático del juego
                const targetDuration = Math.floor(Math.random() * (maxSeconds - minSeconds + 1)) + minSeconds;
                const skipAmount = dropSeconds - targetDuration;

                const t0 = ctx.currentTime;
                const masterGain = ctx.createGain();
                masterGain.connect(ctx.destination);

                if (skipAmount <= 0) {
                    const source = ctx.createBufferSource();
                    source.buffer = currentBuffer;
                    source.connect(masterGain);
                    source.start(t0);
                    source1Ref.current = source;
                } else {
                    const introDuration = Math.min(15, targetDuration * 0.4); 
                    const crossfadeDuration = Math.min(4, introDuration * 0.8); 

                    const source1 = ctx.createBufferSource();
                    source1.buffer = currentBuffer;
                    const gain1 = ctx.createGain();
                    source1.connect(gain1);
                    gain1.connect(masterGain);

                    const source2 = ctx.createBufferSource();
                    source2.buffer = currentBuffer;
                    const gain2 = ctx.createGain();
                    source2.connect(gain2);
                    gain2.connect(masterGain);

                    source1Ref.current = source1;
                    source2Ref.current = source2;

                    source1.start(t0, 0);
                    gain1.gain.setValueAtTime(1, t0 + introDuration - crossfadeDuration);
                    gain1.gain.linearRampToValueAtTime(0, t0 + introDuration);

                    const s2StartTime = t0 + introDuration - crossfadeDuration;
                    const s2Offset = introDuration + skipAmount - crossfadeDuration;
                    
                    source2.start(s2StartTime, s2Offset);
                    gain2.gain.setValueAtTime(0, s2StartTime);
                    gain2.gain.linearRampToValueAtTime(1, t0 + introDuration);

                    source1.stop(t0 + introDuration + 0.1);
                }

                setGameState("playing");
                timeoutRef.current = setTimeout(() => setGameState("exploded"), targetDuration * 1000);
            };

            return (
                <div className="flex flex-col items-center py-6 px-4">
                    <div className="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700 pb-6">
                        
                        <div className="bg-slate-950 p-6 text-center border-b border-slate-700">
                            <div className="text-5xl mb-2">
                                {gameState === 'exploded' ? '💥' : gameState === 'playing' ? '🔥' : '💣'}
                            </div>
                            <h1 className="text-3xl font-bold text-orange-500 uppercase tracking-wider">Bomba Opus</h1>
                        </div>

                        <div className="p-6 space-y-6">
                            {errorMsg && <div className="bg-red-900 text-red-200 p-3 rounded-lg text-sm">⚠️ {errorMsg}</div>}

                            <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700 text-center">
                                {isLoading ? (
                                    <div className="text-yellow-400 animate-pulse font-semibold">⏳ Descargando Opus...</div>
                                ) : audioBuffer ? (
                                    <div className="text-green-400 font-semibold">✅ Canción procesada y lista</div>
                                ) : rawAudioData ? (
                                    <div className="text-blue-400 font-semibold">✅ Audio descargado. Toca iniciar.</div>
                                ) : (
                                    <div className="text-red-400 font-semibold">❌ Error general</div>
                                )}
                            </div>

                            <div className="bg-slate-900 p-4 rounded-xl space-y-4">
                                <div className="text-sm font-semibold text-slate-300">⚙️ Configuración</div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Momento del Drop (mm:ss)</label>
                                    <input type="text" value={dropTimeStr} onChange={(e) => setDropTimeStr(e.target.value)} disabled={gameState !== 'idle'} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-center font-mono text-lg" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Mínimo (seg)</label>
                                        <input type="number" value={minTime} onChange={(e) => setMinTime(e.target.value)} disabled={gameState !== 'idle'} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-center font-mono text-lg" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Máximo (seg)</label>
                                        <input type="number" value={maxTime} onChange={(e) => setMaxTime(e.target.value)} disabled={gameState !== 'idle'} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-center font-mono text-lg" />
                                    </div>
                                </div>
                            </div>

                            {gameState === 'idle' ? (
                                <button onClick={iniciarJuego} disabled={isLoading || isDecoding} className="w-full py-4 rounded-xl font-bold text-lg bg-orange-600 hover:bg-orange-500 text-white disabled:opacity-50">
                                    {isDecoding ? "⚙️ PREPARANDO..." : "▶️ INICIAR JUEGO"}
                                </button>
                            ) : (
                                <button onClick={stopJuego} className="w-full py-4 rounded-xl font-bold text-lg bg-slate-700 text-white">
                                    ⏹️ CANCELAR JUEGO
                                </button>
                            )}
                        </div>
                    </div>

                    {gameState === 'exploded' && (
                        <div className="fixed inset-0 bg-red-950/95 z-50 flex flex-col items-center justify-center p-4">
                            <div className="text-8xl animate-bounce mb-4">💥</div>
                            <h2 className="text-5xl font-black text-white tracking-widest uppercase text-shadow-xl text-center">¡BOMBA!</h2>
                            <button onClick={stopJuego} className="mt-10 px-8 py-4 bg-white text-red-900 font-bold rounded-full text-xl">Jugar de nuevo</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
